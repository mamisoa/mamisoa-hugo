<div class="tags d-flex flex-row flex-wrap">
  <div class="d-flex flex-row"><i class="fas fa-hashtag  mt-1 pe-1"></i>Tags:</div>
  {{ range .Params.tags }}
    {{ $name := . }}
    {{ with site.GetPage (printf "/tags/%s" (. | urlize)) }}
  <div>
    <a href="{{ .RelPermalink }}" class="me-2 ms-2 badge rounded-pill text-bg-light">
      {{- $name -}}
    </a>
  </div>
    {{ end }}
  {{ end }}
</div>
